name: Build and Push Docker Image on Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to use (e.g., v1.0.0, latest, dev)"
        required: false
        default: "manual"
        type: string
  release:
    types: [published]

env:
  REGISTRY: docker.io
  IMAGE_NAME: drpcorg/nodecore
  GO_VERSION: "1.27.3"

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      go-version: "1.27.3"

  lint:
    uses: ./.github/workflows/lint.yml
    with:
      go-version: "1.27.3"

  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      go-version: "1.27.3"
    secrets:
      NODECORE_E2E_DRPC_KEY: ${{ secrets.NODECORE_E2E_DRPC_KEY }}
  build:
    uses: ./.github/workflows/build.yml
    with:
      go-version: "1.27.3"

  upload-release-assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, e2e]
    permissions:
      contents: write
    steps:
      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodecore-ubuntu-latest-1.27.3-${{ steps.short_sha.outputs.sha }}
          path: ./artifacts/ubuntu

      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodecore-macos-latest-1.27.3-${{ steps.short_sha.outputs.sha }}
          path: ./artifacts/macos

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Rename and move artifacts
          cp ./artifacts/ubuntu/nodecore ./release-assets/nodecore-linux-amd64
          cp ./artifacts/macos/nodecore ./release-assets/nodecore-darwin-amd64

          # Make them executable
          chmod +x ./release-assets/*

          # List what we have
          ls -la ./release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ./release-assets/nodecore-linux-amd64
            ./release-assets/nodecore-darwin-amd64

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint, build, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Debug metadata
        run: |
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Labels: ${{ steps.meta.outputs.labels }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            VERSION=${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
            GIT_SHA=${{ github.sha }}
