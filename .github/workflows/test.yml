name: Run tests

on:
  workflow_dispatch: null
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.27.3"
  pull_request:
    paths-ignore:
      - 'chart/**'
      - 'chart/nodecore/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'chart/**'
      - 'chart/nodecore/**'

env:
  GO_VERSION: ${{ inputs.go-version || '1.27.3' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Go project
        uses: ./.github/actions/setup-go-project
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-key-suffix: "test"

      - name: Run tests
        run: make test
